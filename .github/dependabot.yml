version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /nats_nui
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /nats_nui/dependencies
    schedule:
      interval: weekly
    # No Go source lives beside these overlays: tidy deletes all requirements.
    # Zero disables version PRs; security updates and alerts remain enabled.
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /nats_nui/dependencies
    schedule:
      interval: weekly
    # Follow released NUI versions; retain security updates and alerts.
    open-pull-requests-limit: 0
