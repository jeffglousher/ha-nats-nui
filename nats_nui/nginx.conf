user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    server_tokens off;
    map $http_x_remote_user_id $console_admin {
        default 0;
        include /run/nginx/console-admins.map;
    }
    map $http_sec_fetch_site $cross_site {
        default 0;
        cross-site 1;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 8099;
        allow 172.30.32.2;
        deny all;
        if ($cross_site) { return 403; }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        client_max_body_size 16m;
        # Supervisor watchdog has no user identity. This exact endpoint exposes
        # only backend liveness and still requires the actual Supervisor peer.
        location = /health {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:31311/health;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
        }
        location / {
            if ($console_admin = 0) { return 403; }
            proxy_pass http://127.0.0.1:31311;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # HA authenticates ingress. Its session and bearer credentials must
            # never reach the management application behind the gateway.
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Ingress-Path $http_x_ingress_path;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
